<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELLUP - Modifier le profil</title>
    <link rel="stylesheet" href="../../css/wellup.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">WELLUP • Suivi Physique</a>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="user_space.html">Tableau de bord</a>
            <a href="profile.html">Mon Profil</a>
        </nav>
    </header>
    <main class="container">
        <div class="form-box">
            <h2>Modifier mon profil</h2>
            <form id="editProfileForm" novalidate>
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" value="Ben Ali" required>
                    <small class="error-msg" id="nomError"></small>
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" value="Sami" required>
                    <small class="error-msg" id="prenomError"></small>
                </div>
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" value="sami_fit" required>
                    <small class="error-msg" id="usernameError"></small>
                </div>
                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" value="sami@wellup.tn" required>
                    <small class="error-msg" id="emailError"></small>
                </div>
                <div class="actions">
                    <button type="submit" class="btn">Enregistrer les modifications</button>
                    <a href="profile.html" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </main>
    <script src="../../js/profile.js"></script>
    <footer class="footer">
        <p>&copy; 2026 WELLUP - Système : Suivi de l'activité physique</p>
    </footer>
</body>
</html>
