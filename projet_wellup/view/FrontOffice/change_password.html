<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELLUP - Changer le mot de passe</title>
    <link rel="stylesheet" href="../../css/wellup.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">WELLUP • Suivi Physique</a>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="user_space.html">Tableau de bord</a>
            <a href="profile.html">Mon Profil</a>
        </nav>
    </header>
    <main class="container">
        <div class="form-box">
            <h2>Changer le mot de passe</h2>
            <form id="changePasswordForm" novalidate>
                <div class="form-group">
                    <label for="current_password">Mot de passe actuel</label>
                    <input type="password" id="current_password" name="current_password" required>
                </div>
                <div class="form-group">
                    <label for="new_password">Nouveau mot de passe (min. 8 caractères)</label>
                    <input type="password" id="new_password" name="new_password" required>
                    <small class="error-msg" id="newPwdError"></small>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirmer le nouveau mot de passe</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                    <small class="error-msg" id="confirmPwdError"></small>
                </div>
                <div class="actions">
                    <button type="submit" class="btn">Mettre à jour le mot de passe</button>
                    <a href="profile.html" class="btn btn-secondary">Retour</a>
                </div>
            </form>
        </div>
    </main>
    <script src="../../js/profile.js"></script>
    <footer class="footer">
        <p>&copy; 2026 WELLUP - Système : Suivi de l'activité physique</p>
    </footer>
</body>
</html>
