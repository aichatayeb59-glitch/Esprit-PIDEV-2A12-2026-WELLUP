
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des objectifs</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>

<body>

    <header>
        <h1>Mes objectifs personnels</h1>
        <p>Organisez vos objectifs et suivez vos progrès.</p>
    </header>

    <main>

        <section class="form-section">
            <h2>Ajouter un objectif</h2>

            <form id="objectifForm">

                <label for="titre">Nom de l'objectif :</label>
                <input type="text" id="titre" placeholder="Exemple : Faire du sport" required>

                <label for="description">Description :</label>
                <textarea id="description" placeholder="Décrivez votre objectif"></textarea>

                <label for="dateFin">Date limite :</label>
                <input type="date" id="dateFin" required>

                <button type="submit" id="submitBtn">Ajouter</button>

            </form>
        </section>

        <section class="objectifs-section">
            <h2>Liste de mes objectifs</h2>

            <div id="listeObjectifs">
                <p>Aucun objectif pour le moment.</p>
            </div>

        </section>

    </main>

<script src="../model/Objectif.js"></script>
<script src="../controller/ObjectifController.js"></script>
<script src="../assets/app.js"></script>

</body>
</html>
